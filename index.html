<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #f43397;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .search-bar {
      width: 40%;
      padding: 8px;
      border-radius: 4px;
      border: none;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .product-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      background: #fff;
    }
    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
    }
    .price {
      color: #f43397;
      font-weight: bold;
      margin: 10px 0;
    }
    .buy-btn {
      background-color: #f43397;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h2>OnlineStore</h2>
    <input type="text" class="search-bar" placeholder="Search products...">
    <div>
      <a href="#" style="color: white; text-decoration: none;">Cart</a>
    </div>
  </header>

  <div class="container">
    <h3>Popular Products</h3>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Product">
        <h4>Saree Collection</h4>
        <p class="price">₹499</p>
        <button class="buy-btn">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Product">
        <h4>Men's T-Shirt</h4>
        <p class="price">₹299</p>
        <button class="buy-btn">Add to Cart</button>
      </div>
    </div>
  </div>

</body>
</html>
