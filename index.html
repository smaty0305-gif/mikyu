<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZELX - Clean Shopping</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#fff;padding-bottom:60px}
.top{position:sticky;top:0;z-index:100;background:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e6e6e6}
.logo{color:#9f2089;font-weight:900;font-size:26px;font-style:italic}
.search{flex:1;padding:11px 12px;border:1px solid #aaa;border-radius:4px;font-size:12px;background:#f5f5f5}
.cart{font-size:20px;position:relative} .cart b{position:absolute;top:-6px;right:-6px;background:#f43397;color:#fff;font-size:10px;padding:2px 5px;border-radius:50%}
.benefits{display:flex;overflow:auto;gap:0;padding:0;background:#fff;border-bottom:1px solid #eee}
.benefits div{min-width:90px;padding:8px;text-align:center;font-size:9px;border-right:1px solid #f0f0f0}
.benefits b{color:#9f2089;font-size:10px;display:block}
.main{display:flex}
.left{width:28%;background:#f5f5f5;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;border-right:1px solid #e0e0e0}
.left div{padding:12px 4px;border-bottom:1px solid #e6e6e6;text-align:center;background:#fff;font-size:10px;cursor:pointer}
.left div.on{background:#fff0f6;border-left:4px solid #9f2089;color:#9f2089;font-weight:700}
.left div span{font-size:18px;display:block;margin-bottom:3px}
.right{width:72%;background:#fff;padding:8px}
.rtitle{font-weight:800;font-size:13px;margin:4px 0 10px}
.subtitle{font-weight:700;font-size:11px;margin:12px 0 6px;color:#333;border-left:3px solid #9f2089;padding-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .it{text-align:center;padding:8px;border:1px solid #f2f2f2;border-radius:10px;background:#fafafa;cursor:pointer}
.grid2 .it img{width:55px;height:55px;border-radius:50%;background:#fff}
.grid2 .it p{font-size:10px;margin-top:4px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e6e6e6;margin-top:10px}
.card{background:#fff;padding:6px} .card img{width:100%;height:125px;object-fit:contain} .card h4{font-size:10px;height:28px;overflow:hidden}
.price{font-weight:900;font-size:12px} .off{color:#038d63;font-size:9px}
.bad{font-size:8px;padding:2px 6px;border-radius:10px;display:inline-block;margin:2px 2px 2px 0} .free{background:#e6f8f2;color:#038d63} .cod{background:#f0f0ff;color:#666}
.btn{width:100%;padding:7px;border-radius:4px;font-weight:700;font-size:10px;margin-top:4px} .b1{border:1px solid #9f2089;background:#fff;color:#9f2089} .b2{background:#9f2089;color:#fff;border:0}
.bottom{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:100} .bottom div{font-size:10px;text-align:center;color:#888} .bottom div.on{color:#9f2089;font-weight:bold}
.page{display:none} .page.on{display:block}
.box{background:#fff;padding:10px;margin:6px;border:1px solid #eee;border-radius:6px}
</style>
</head>
<body>
<div class="top"><div class="logo">zelx</div><input id="sr" class="search" placeholder="Search Saree, Kurti, Product Code" oninput="searchF()"><div class="cart" onclick="openP('cart')">🛒<b id="cc">0</b></div></div>
<div class="benefits"><div><b>Free Delivery</b>All Orders</div><div><b>COD</b>Available</div><div><b>7-Day Return</b>Easy Return</div><div><b>Lowest Price</b>Guaranteed</div><div><b>100% Safe</b>Payments</div></div>

<div id="p-home" class="page on"><div class="main"><div class="left" id="left"></div><div class="right"><div id="right"></div><div id="plist" class="prod-grid"></div></div></div></div>
<div id="p-detail" class="page"><div id="dbox"></div></div>
<div id="p-cart" class="page"><h3 style="padding:12px">My Cart</h3><div id="cbox"></div><div class="box"><p id="total" style="font-weight:bold"></p><input id="addr" class="input" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;margin:5px 0" placeholder="Enter Delivery Address"><button class="btn b2" onclick="placeO()">Place Order - COD Available</button><button class="btn b1" onclick="openP('home')">Continue Shopping</button></div></div>
<div id="p-orders" class="page"><h3 style="padding:12px">My Orders</h3><div id="obox"></div></div>

<div class="bottom"><div id="bn-home" class="on" onclick="openP('home')">🏠<br>Home</div><div onclick="openP('orders')">📦<br>Orders</div><div onclick="openP('cart')">🛒<br>Cart <b id="cc2">0</b></div><div>👤<br>Account</div></div>

<script>
const cats=[
{name:"Women Ethnic",icon:"👗",subs:[{t:"Sarees",i:["All Sarees","Silk Sarees","Cotton Sarees","Georgette Sarees","Chiffon Sarees","Net Sarees","Heavy Work Sarees","Blouse"]},{t:"Kurtis",i:["Anarkali Kurtis","Rayon Kurtis","Cotton Kurtis","Embroidered Kurtis","Kurta Sets","Sharara","Gowns","Dupattas"]}]},
{name:"Women Western",icon:"👚",subs:[{t:"Western",i:["Tops","Dresses","Jeans","Palazzo","Jumpsuits","Leggings"]}]},
{name:"Men",icon:"👕",subs:[{t:"Top Wear",i:["T-Shirts","Shirts","Kurtas","Jackets"]},{t:"Bottom & Shoes",i:["Jeans","Track Pants","Casual Shoes","Sports Shoes","Sandals"]}]},
{name:"Kids & Toys",icon:"🧸",subs:[{t:"Kids Wear",i:["Frocks","T-Shirts","Jeans","Baby Sets"]},{t:"Toys",i:["Soft Toys","Dolls","Cars","Educational Toys"]}]},
{name:"Home & Kitchen",icon:"🏠",subs:[{t:"Kitchen",i:["Storage","Cookware","Containers","Choppers","Serveware"]},{t:"Decor",i:["Bedsheets","Curtains","Wall Decor","Cushions","Clocks"]}]},
{name:"Beauty & Health",icon:"💄",subs:[{t:"Makeup",i:["Lipstick","Face Cream","Serums","Face Wash","Kajal","Nail Paint"]},{t:"Baby & Health",i:["Diapers","Baby Care","Healthcare"]}]},
{name:"Jewellery",icon:"💎",subs:[{t:"Jewellery",i:["Jewellery Set","Earrings","Mangalsutra","Bangles","Necklace","Rings","Anklets","Nose Pins"]}]},
{name:"Bags & Footwear",icon:"👜",subs:[{t:"Bags",i:["Handbags","Sling Bags","Backpacks","Clutches","Wallets"]},{t:"Footwear",i:["Heels","Flats","Boots","Bellies","Wedges"]}]},
{name:"Electronics",icon:"🎧",subs:[{t:"Mobile",i:["Phone Cases","Chargers","Power Banks"]},{t:"Gadgets",i:["Smart Watches","Earbuds","Headphones","Speakers","Trimmers"]}]},
{name:"Grocery",icon:"🛒",subs:[{t:"Grocery",i:["Dry Fruits","Spices","Pulses","Oil","Tea","Snacks","Biscuits"]}]},
{name:"Sports",icon:"🏏",subs:[{t:"Sports",i:["Cricket","Football","Gym","Badminton"]}]},
{name:"Stationery",icon:"📚",subs:[{t:"Stationery",i:["Notebooks","Pens","Art Supplies","School Bags","Office Supplies","Pet Supplies","Books"]}]}
];
let products=[
{id:1,name:"Silk Saree Heavy Work Design",cat:"Silk Sarees",price:599,mrp:1999,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"},
{id:2,name:"Anarkali Kurta Palazzo Set",cat:"Kurta Sets",price:799,mrp:2499,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400"},
{id:3,name:"Georgette Saree Party Wear",cat:"Georgette Sarees",price:549,mrp:1499,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"},
{id:4,name:"Cotton Kurti Daily Wear",cat:"Cotton Kurtis",price:399,mrp:999,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400"},
{id:5,name:"Men Cotton T-Shirt",cat:"T-Shirts",price:349,mrp:899,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},
{id:6,name:"Kids Frocks Girls Dress",cat:"Frocks",price:299,mrp:799,img:"https://images.unsplash.com/photo-1518831959646-742c3a14ebf7?w=400"},
{id:7,name:"Kitchen Storage Container Set",cat:"Containers",price:299,mrp:699,img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400"},
{id:8,name:"Lipstick Matte Red Beauty",cat:"Lipstick",price:149,mrp:399,img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400"},
{id:9,name:"Gold Jewellery Set Wedding",cat:"Jewellery Set",price:199,mrp:599,img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400"},
{id:10,name:"Earrings Jhumka Design",cat:"Earrings",price:99,mrp:299,img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400"},
{id:11,name:"Handbag Women Sling",cat:"Handbags",price:449,mrp:1199,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"},
{id:12,name:"Wireless Earbuds Pro",cat:"Earbuds",price:599,mrp:1999,img:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400"},
{id:13,name:"Dry Fruits Box Premium",cat:"Dry Fruits",price:499,mrp:999,img:"https://images.unsplash.com/photo-1542838132-92c53300491e?w=400"},
{id:14,name:"Notebooks & Stationery Kit",cat:"Notebooks",price:199,mrp:399,img:"https://images.unsplash.com/photo-1503602461226-2472237a7d99?w=400"}
];
let cart=[],orders=[],cur=0;
function buildLeft(){let h="";cats.forEach((c,i)=>{h+=`<div id="l${i}" class="${i==0?'on':''}" onclick="showCat(${i})"><span>${c.icon}</span>${c.name}</div>`});document.getElementById('left').innerHTML=h;}
function showCat(i){cur=i;document.querySelectorAll('.left div').forEach(d=>d.classList.remove('on'));document.getElementById('l'+i).classList.add('on');let c=cats[i];let h=`<div class="rtitle">${c.name}</div>`;c.subs.forEach(s=>{h+=`<div class="subtitle">${s.t}</div><div class="grid2">`;s.i.forEach(it=>{h+=`<div class="it" onclick="filterSub('${it}')"><img src="https://via.placeholder.com/80/f9f0f9/9f2089?text=${encodeURIComponent(it[0])}"><p>${it}</p></div>`});h+=`</div>`});document.getElementById('right').innerHTML=h;render(products);}
function filterSub(n){document.getElementById('right').innerHTML=`<div class="rtitle">${n}</div><button onclick="showCat(${cur})" style="padding:5px 10px;border:1px solid #9f2089;background:#fff;color:#9f2089;border-radius:4px;font-size:11px">← Back to ${cats[cur].name}</button>`;render(products.filter(p=>p.cat==n || p.name.toLowerCase().includes(n.toLowerCase().split(' ')[0]) || n.toLowerCase().includes(p.cat.toLowerCase().split(' ')[0])));}
function render(list){let h="";list.forEach(p=>{let off=Math.round((1-p.price/p.mrp)*100);h+=`<div class="card" onclick="showD(${p.id})"><img src="${p.img}"><h4>${p.name}</h4><div style="font-size:8px;color:#888">${p.cat}</div><div class="price">₹${p.price} <s style="font-size:9px;color:#888">₹${p.mrp}</s> <span class="off">${off}% off</span></div><div><span class="bad free">Free Delivery</span><span class="bad cod">COD</span></div><button class="btn b1" onclick="event.stopPropagation();addC(${p.id})">Add to Cart</button></div>`});document.getElementById('plist').innerHTML=h||"<div class='box'>No products found</div>";document.getElementById('cc').innerText=cart.length;document.getElementById('cc2').innerText=cart.length;}
function addC(id){cart.push(products.find(x=>x.id==id));render(products);alert("Added to Cart - Free Delivery!");openP('cart');showC();}
function showC(){let t=0,tx="";cart.forEach((p,i)=>{t+=p.price;tx+=`<div class="box"><b>${p.name}</b> - ₹${p.price}<br><span style="font-size:9px;color:#038d63">Free Delivery | COD | 7-Day Return</span><span style="float:right;color:red" onclick="cart.splice(${i},1);showC();render(products)">✕</span></div>`});document.getElementById('cbox').innerHTML=tx||"<div class='box'>Cart Empty - Add products!</div>";document.getElementById('total').innerText="Total: ₹"+t+" (Free Delivery)";}
function showD(id){let p=products.find(x=>x.id==id);let off=Math.round((1-p.price/p.mrp)*100);document.getElementById('dbox').innerHTML=`<div class="box"><img src="${p.img}" style="width:100%;height:300px;object-fit:contain"><h3>${p.name}</h3><div style="font-size:11px;color:#666">${p.cat}</div><div class="price">₹${p.price} <s style="font-size:12px;color:#888">₹${p.mrp}</s> ${off}% OFF</div><div style="margin:6px 0"><span class="bad free">✓ Free Delivery</span><span class="bad cod">✓ Cash On Delivery</span><span class="bad free">✓ 7-Day Return</span><span class="bad cod">✓ Lowest Price</span></div><button class="btn b1" onclick="addC(${p.id})">Add to Cart</button><button class="btn b2" onclick="addC(${p.id});openP('cart')">Buy Now</button><button class="btn b1" onclick="openP('home')">← Continue Shopping</button></div>`;openP('detail');}
function placeO(){if(!cart.length)return alert("Cart Empty!");let t=cart.reduce((s,p)=>s+p.price,0);orders.unshift({id:Date.now(),total:t,items:[...cart],status:"Ordered"});cart=[];render(products);alert("Order Placed! ₹"+t+" | Free Delivery | COD | Valmo Delivery");openP('orders');showO();}
function showO(){let h="";orders.forEach(o=>{h+=`<div class="box"><b>Order #${o.id}</b> - ${o.status}<br>${o.items.map(i=>i.name).join(", ")}<br><b>Total: ₹${o.total}</b> - Free Delivery<br><span style="font-size:9px;color:#038d63">Valmo Delivery | COD | 7-Day Return</span></div>`});document.getElementById('obox').innerHTML=h||"<div class='box'>No Orders Yet</div>";}
function openP(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById('p-'+p).classList.add('on');if(p=='cart')showC();if(p=='orders')showO();}
function searchF(){let q=document.getElementById('sr').value.toLowerCase();if(!q){showCat(cur);return;}document.getElementById('right').innerHTML=`<div class="rtitle">Search results for "${q}"</div>`;render(products.filter(p=>p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)));}
buildLeft();showCat(0);
</script>
</body>
</html>
