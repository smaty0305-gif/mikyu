<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mikyU - Shop smart. Live better</title>
<style>
body{font-family:sans-serif;margin:0;background:#f5f5f5}
header{background:#131921;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
header b{font-size:20px}
header span{margin-left:10px;cursor:pointer;background:#232f3e;padding:6px 10px;border-radius:6px}
.product{background:white;margin:10px;padding:10px;border-radius:10px;text-align:center}
.product img{width:100%;height:180px;object-fit:contain}
button{background:#febd69;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;width:100%;margin-top:5px;cursor:pointer}
#cartBox{background:white;padding:15px;margin:10px;border-radius:10px}
</style>
</head>
<body>

<header>
<b>mikyU</b>
<div>
<span onclick="showPage('home')">Home</span>
<span onclick="showPage('cart')">Cart (<label id="c">0</label>)</span>
<span onclick="showPage('seller')">Seller Zone</span>
<span onclick="showPage('admin')">Admin</span>
</div>
</header>

<div id="home"></div>
<div id="cart" style="display:none"><div id="cartBox"></div></div>
<div id="seller" style="display:none;padding:15px;background:white;margin:10px;border-radius:10px">
<h3>Seller Zone</h3>
<p>Seller Login - Soon you can add product here</p>
<input placeholder="Product Name" id="pname" style="width:100%;padding:10px;margin:5px 0">
<input placeholder="Price" id="pprice" style="width:100%;padding:10px;margin:5px 0">
<input placeholder="Image Link" id="pimg" style="width:100%;padding:10px;margin:5px 0">
<button onclick="addProduct()">Add Product</button>
</div>
<div id="admin" style="display:none;padding:15px;background:white;margin:10px;border-radius:10px">
<h3>Admin Panel</h3><p>Total Products: <label id="pc">0</label></p><p>Total Orders: 0</p>
</div>

<script>
let products = [
{id:1,name:"Gudiyattam Cotton Saree",price:899,img:"https://m.media-amazon.com/images/I/81h6o2z7sUL._UY879_.jpg"},
{id:2,name:"Men's Lungi Combo",price:450,img:"https://m.media-amazon.com/images/I/71H1e7r+JXL._UY879_.jpg"},
{id:3,name:"Kids Dress",price:599,img:"https://m.media-amazon.com/images/I/71cFhY2R2eL._UY879_.jpg"},
{id:4,name:"Your New Product",price:350,img:"https://via.placeholder.com/300"}
];
let cart=[];

function showProducts(){
let h="";products.forEach(p=>{
h+=`<div class="product"><img src="${p.img}"><h4>${p.name}</h4><p>Rs.${p.price}</p><button onclick="addToCart(${p.id})">Add to Cart</button></div>`;
});
document.getElementById('home').innerHTML=h;
document.getElementById('pc').innerText=products.length;
}
function addToCart(id){let p=products.find(x=>x.id==id);cart.push(p);document.getElementById('c').innerText=cart.length;alert(p.name+" added da!");}
function showPage(p){document.getElementById('home').style.display=p=='home'?'block':'none';document.getElementById('cart').style.display=p=='cart'?'block':'none';document.getElementById('seller').style.display=p=='seller'?'block':'none';document.getElementById('admin').style.display=p=='admin'?'block':'none';if(p=='cart')showCart();}
function showCart(){if(cart.length==0){document.getElementById('cartBox').innerHTML="<h3>Cart Empty da</h3>";return;}let t=0,txt="";cart.forEach(p=>{t+=p.price;txt+=`<p>${p.name} - Rs.${p.price}</p>`;});txt+=`<hr><b>Total: Rs.${t}</b><br><br><button onclick="orderWhatsApp(${t})" style="background:#25D366;color:white">WhatsApp la Order Pannu - Rs.${t}</button>`;document.getElementById('cartBox').innerHTML=txt;}
function orderWhatsApp(total){let msg="Hi mikyU! Order venum da:%0A";cart.forEach(p=>msg+=p.name+" - Rs."+p.price+"%0A");msg+="%0ATotal: Rs."+total+"%0AGudiyattam Delivery";window.open("https://wa.me/919999999999?text="+msg,"_blank");}
function addProduct(){let n=document.getElementById('pname').value,p=document.getElementById('pprice').value,i=document.getElementById('pimg').value;if(!n||!p)return alert("Name, Price fill pannu da");products.push({id:Date.now(),name:n,price:parseInt(p),img:i||"https://via.placeholder.com/300"});showProducts();alert("Product Added da!");showPage('home');}
showProducts();
</script>
</body>
</html>
