<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelx - Premium Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- App Container (Mobile First Frame View) -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative pb-20">

        <!-- Top Header -->
        <header class="sticky top-0 z-50 bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-2">
                <button class="text-gray-600 focus:outline-none"><i class="fa-solid fa-bars text-lg"></i></button>
                <span class="text-xl font-black tracking-wider text-gray-900">ZEL<span class="text-emerald-600">X</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <button class="relative text-gray-700 hover:text-emerald-600"><i class="fa-regular fa-bell text-xl"></i></button>
                <button class="relative text-gray-700 hover:text-emerald-600">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span class="absolute -top-1 -right-2 bg-emerald-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">2</span>
                </button>
            </div>
        </header>

        <!-- Search Bar Section -->
        <div class="px-4 py-3 bg-white">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" placeholder="Search for products, brands..." class="w-full bg-gray-100 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition">
            </div>
        </div>

        <!-- Banner / Hero Carousel -->
        <div class="px-4 mb-4">
            <div class="bg-gradient-to-r from-gray-900 to-gray-800 rounded-2xl p-5 text-white relative overflow-hidden shadow-md">
                <div class="relative z-10 max-w-[70%]">
                    <span class="bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Mega Sale</span>
                    <h2 class="text-lg font-bold mt-1 leading-tight">Up to 40% Off on Essentials</h2>
                    <p class="text-xs text-gray-300 mt-1">Strict Cash on Delivery Available</p>
                    <button class="mt-3 bg-white text-gray-900 text-xs font-semibold px-4 py-2 rounded-lg shadow hover:bg-gray-100 transition">Shop Now</button>
                </div>
            </div>
        </div>

        <!-- Categories Row -->
        <div class="px-4 mb-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-sm font-bold text-gray-900">Categories</h3>
                <span class="text-xs font-medium text-emerald-600 cursor-pointer">See All</span>
            </div>
            <div class="grid grid-cols-4 gap-3">
                <div class="flex flex-col items-center cursor-pointer group">
                    <div class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-700 group-hover:bg-emerald-50 group-hover:text-emerald-600 transition shadow-sm"><i class="fa-solid fa-mobile-screen text-lg"></i></div>
                    <span class="text-[11px] font-medium text-gray-600 mt-1.5">Electronics</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer group">
                    <div class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-700 group-hover:bg-emerald-50 group-hover:text-emerald-600 transition shadow-sm"><i class="fa-solid fa-shirt text-lg"></i></div>
                    <span class="text-[11px] font-medium text-gray-600 mt-1.5">Fashion</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer group">
                    <div class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-700 group-hover:bg-emerald-50 group-hover:text-emerald-600 transition shadow-sm"><i class="fa-solid fa-house text-lg"></i></div>
                    <span class="text-[11px] font-medium text-gray-600 mt-1.5">Home</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer group">
                    <div class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-700 group-hover:bg-emerald-50 group-hover:text-emerald-600 transition shadow-sm"><i class="fa-solid fa-spa text-lg"></i></div>
                    <span class="text-[11px] font-medium text-gray-600 mt-1.5">Beauty</span>
                </div>
            </div>
        </div>

        <!-- Product Grid Section -->
        <div class="px-4 flex-1">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-gray-900">Featured Products</h3>
                <span class="text-xs text-gray-500">COD Available</span>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <!-- Product Card 1 -->
                <div class="bg-white border border-gray-100 rounded-2xl p-3 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="w-full h-32 bg-gray-100 rounded-xl mb-2 relative overflow-hidden flex items-center justify-center text-gray-400">
                            <i class="fa-solid fa-image text-2xl"></i>
                            <span class="absolute top-2 left-2 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">25% OFF</span>
                        </div>
                        <h4 class="text-xs font-semibold text-gray-800 line-clamp-1">Minimalist Square Sunglasses</h4>
                        <p class="text-[10px] text-gray-500 mt-0.5">Unisex Black Frame</p>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-gray-900">₹799</span>
                            <span class="text-[10px] text-gray-400 line-through ml-1">₹1,099</span>
                        </div>
                        <button class="bg-emerald-600 text-white w-7 h-7 rounded-lg flex items-center justify-center hover:bg-emerald-700 transition"><i class="fa-solid fa-plus text-xs"></i></button>
                    </div>
                </div>

                <!-- Product Card 2 -->
                <div class="bg-white border border-gray-100 rounded-2xl p-3 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="w-full h-32 bg-gray-100 rounded-xl mb-2 relative overflow-hidden flex items-center justify-center text-gray-400">
                            <i class="fa-solid fa-image text-2xl"></i>
                            <span class="absolute top-2 left-2 bg-emerald-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">COD</span>
                        </div>
                        <h4 class="text-xs font-semibold text-gray-800 line-clamp-1">Herbal Hair Growth Vitalizer Oil</h4>
                        <p class="text-[10px] text-gray-500 mt-0.5">Hairvel Care</p>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-gray-900">₹449</span>
                        </div>
                        <button class="bg-emerald-600 text-white w-7 h-7 rounded-lg flex items-center justify-center hover:bg-emerald-700 transition"><i class="fa-solid fa-plus text-xs"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-6 py-2.5 flex justify-between items-center shadow-lg z-50">
            <button class="flex flex-col items-center text-emerald-600">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px] font-medium mt-1">Home</span>
            </button>
            <button class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-store text-base"></i>
                <span class="text-[10px] font-medium mt-1">Shop</span>
            </button>
            <button class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-receipt text-base"></i>
                <span class="text-[10px] font-medium mt-1">Orders</span>
            </button>
            <button class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-user text-base"></i>
                <span class="text-[10px] font-medium mt-1">Account</span>
            </button>
        </nav>

    </div>

</body>
</html>
