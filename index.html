<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZELX - All Categories Full</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#f5f5f5}
.top{position:sticky;top:0;z-index:100;background:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e6e6e6}
.logo{color:#9f2089;font-weight:900;font-size:28px;font-style:italic}
.search{flex:1;padding:11px 14px;border:1px solid #999;border-radius:4px;font-size:13px}
.cart{font-size:22px;position:relative} .cart b{position:absolute;top:-6px;right:-6px;background:#f43397;color:#fff;font-size:10px;padding:2px 5px;border-radius:50%}
.main{display:flex}
.left{width:30%;background:#f5f5f5;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;border-right:1px solid #e0e0e0}
.left div{padding:14px 6px;border-bottom:1px solid #e6e6e6;text-align:center;background:#fff;font-size:11px;line-height:12px}
.left div.on{background:#fff0f6;border-left:4px solid #9f2089;color:#9f2089;font-weight:700}
.left div img{width:32px;height:32px;border-radius:50%;background:#fff0f6;margin:0 auto 5px;display:block}
.right{width:70%;background:#fff;padding:10px;min-height:100vh}
.rtitle{font-weight:800;font-size:14px;margin:6px 0 12px 2px}
.subtitle{font-weight:700;font-size:12px;margin:14px 0 8px 0;color:#333;border-left:3px solid #9f2089;padding-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .it{text-align:center;padding:6px;border:1px solid #f0f0f0;border-radius:8px;background:#fafafa}
.grid2 .it img{width:60px;height:60px;border-radius:50%;background:#fff;object-fit:cover}
.grid2 .it p{font-size:11px;margin-top:4px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e6e6e6;margin-top:12px}
.card{background:#fff;padding:7px} .card img{width:100%;height:135px;object-fit:contain} .card h4{font-size:11px;height:28px;overflow:hidden}
.price{font-weight:900;font-size:13px} .free{font-size:9px;background:#e6f8f2;color:#038d63;padding:2px 6px;border-radius:10px}
.btn{width:100%;padding:7px;border-radius:4px;font-weight:700;font-size:11px;margin-top:4px} .b1{border:1px solid #9f2089;background:#fff;color:#9f2089} .b2{background:#9f2089;color:#fff;border:0}
.bottom{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:100} .bottom div{font-size:10px;text-align:center} .bottom div.on{color:#9f2089;font-weight:bold}
.page{display:none} .page.on{display:block}
.box{background:#fff;padding:10px;margin:6px;border:1px solid #eee}
</style>
</head>
<body>
<div class="top"><div class="logo">zelx</div><input id="sr" class="search" placeholder="Search Saree, Kurti, Product Code" oninput="searchF()"><div class="cart" onclick="openP('cart')">🛒<b id="cc">0</b></div></div>

<div id="p-home" class="page on">
<div class="main">
<div class="left" id="left"></div>
<div class="right"><div id="right"></div><div id="plist" class="prod-grid"></div></div>
</div>
</div>

<div id="p-cart" class="page"><h3 style="padding:12px">Cart</h3><div id="cbox"></div><div class="box"><p id="total"></p><button class="btn b2" onclick="placeO()">Place Order - Free Delivery</button></div></div>
<div id="p-orders" class="page"><h3 style="padding:12px">Orders</h3><div id="obox"></div></div>
<div class="bottom"><div id="bn-home" class="on" onclick="openP('home')">🏠<br>Home</div><div onclick="openP('orders')">📦<br>Orders</div><div onclick="openP('cart')">🛒<br>Cart</div></div>

<script>
const categories=[
{name:"Women Ethnic",icon:"👗",subs:[
{title:"Sarees",items:["All Sarees","Silk Sarees","Cotton Sarees","Georgette Sarees","Chiffon Sarees","Heavy Sarees","Net Sarees","Blouse"]},
{title:"Kurtis",items:["All Kurtis","Anarkali Kurtis","Rayon Kurtis","Cotton Kurtis","Embroidered Kurtis","Kurta Sets"]},
{title:"Kurta Sets",items:["All Kurta Sets","Kurta Palazzo","Kurta Pant","Sharara","Anarkali Sets"]},
{title:"Lehengas & Others",items:["Lehenga Choli","Dupatta","Gowns","Ethnic Bottomwear"]}
]},
{name:"Women Western",icon:"👚",subs:[
{title:"Topwear",items:["Tops","Dresses","T-Shirts","Jumpsuits","Jeans","Trousers"]},
{title:"Bottomwear",items:["Palazzo","Leggings","Shorts","Skirts"]}
]},
{name:"Men",icon:"👕",subs:[
{title:"Top Wear",items:["All Top Wear","T-Shirts","Shirts","Kurtas","Jackets","Sweatshirts"]},
{title:"Bottom Wear",items:["Jeans","Trousers","Track Pants","Shorts","Lungis"]},
{title:"Footwear",items:["Casual Shoes","Formal Shoes","Sports Shoes","Sandals"]}
]},
{name:"Kids & Toys",icon:"🧸",subs:[
{title:"Boys & Girls 2+ Years",items:["Dresses","T-Shirts","Jeans","Ethnic Wear","Sweaters"]},
{title:"Infant 0-2 Years",items:["Rompers","Baby Sets","Frocks"]},
{title:"Toys",items:["Soft Toys","Educational Toys","Cars","Dolls"]}
]},
{name:"Home & Kitchen",icon:"🏠",subs:[
{title:"Kitchen",items:["Kitchen Storage","Cookware","Serveware","Tableware","Containers"]},
{title:"Home Decor",items:["Bedsheets","Curtains","Cushions","Wall Decor","Clocks"]},
{title:"Home Furnishing",items:["Bath Towels","Blankets","Doormats"]}
]},
{name:"Beauty & Health",icon:"💄",subs:[
{title:"Makeup",items:["Face","Eyes","Lips","Nails","Makeup Kits"]},
{title:"Skincare",items:["Face Cream","Serums","Face Wash","Masks"]},
{title:"Baby & Health",items:["Diapers","Baby Care","Healthcare"]}
]},
{name:"Jewellery & Accessories",icon:"💎",subs:[
{title:"Jewellery",items:["Jewellery Set","Earrings","Mangalsutra","Bangles","Necklace","Rings","Anklets"]},
{title:"Women Accessories",items:["Hair Accessories","Sunglasses","Saree Pins"]}
]},
{name:"Bags & Footwear",icon:"👜",subs:[
{title:"Women Bags",items:["Handbags","Sling Bags","Clutches","Wallets","Backpacks"]},
{title:"Footwear",items:["Heels","Flats","Wedges","Boots","Bellies"]},
{title:"Men Bags",items:["Men Wallets","Backpacks"]}
]},
{name:"Electronics",icon:"🎧",subs:[
{title:"Mobile & Accessories",items:["Mobile Cases","Chargers","Power Banks","Cables"]},
{title:"Appliances",items:["Smart Watches","Earbuds","Headphones","Speakers"]},
{title:"Kitchen Appliances",items:["Mixer","Gas Stove","Induction"]}
]},
{name:"Grocery",icon:"🛒",subs:[
{title:"Grocery",items:["Pulses","Spices","Dry Fruits","Oil","Tea","Snacks"]},
{title:"Baby Grocery",items:["Baby Food","Health Drinks"]}
]},
{name:"Sports",icon:"🏏",subs:[
{title:"Sports",items:["Cricket","Football","Badminton","Gym Equipment"]}
]},
{name:"Stationery",icon:"📚",subs:[
{title:"Stationery",items:["Notebooks","Pens","Art Supplies","School Bags","Office Supplies"]}
]}
];

let products=[
{id:1,name:"Silk Saree Heavy Work",cat:"Sarees",img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400",price:599},
{id:2,name:"Anarkali Kurta Palazzo Set",cat:"Kurta Sets",img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400",price:799},
{id:3,name:"Women Dress Western Top",cat:"Dresses",img:"https://images.unsplash.com/photo-1515372039744-b8f02a3ae442?w=400",price:499},
{id:4,name:"Men Cotton T-Shirt Combo",cat:"T-Shirts",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",price:399},
{id:5,name:"Kids Frocks Dresses",cat:"Dresses",img:"https://images.unsplash.com/photo-1518831959646-742c3a14ebf7?w=400",price:349},
{id:6,name:"Kitchen Storage Container Set",cat:"Containers",img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400",price:299},
{id:7,name:"Face Glow Cream Beauty",cat:"Face Cream",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400",price:199},
{id:8,name:"Gold Plated Jewellery Set",cat:"Jewellery Set",img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400",price:199},
{id:9,name:"Women Handbag Sling",cat:"Handbags",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400",price:399},
{id:10,name:"Wireless Earbuds Pro",cat:"Earbuds",img:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400",price:599},
{id:11,name:"Shimla Apples Grocery Fresh",cat:"Dry Fruits",img:"https://images.unsplash.com/photo-1619546813926-a8e2d82a7e30?w=400",price:499},
{id:12,name:"Men Casual Shoes",cat:"Casual Shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",price:699}
];

let cart=[],orders=[],curMain=0;
function buildLeft(){let h="";categories.forEach((c,i)=>{h+=`<div id="l${i}" class="${i==0?'on':''}" onclick="showCat(${i})">${c.icon}<br>${c.name}</div>`});document.getElementById('left').innerHTML=h;}
function showCat(i){curMain=i;document.querySelectorAll('.left div').forEach(d=>d.classList.remove('on'));document.getElementById('l'+i).classList.add('on');let c=categories[i];let h=`<div class="rtitle">${c.name} - All Categories</div>`;c.subs.forEach(s=>{h+=`<div class="subtitle">${s.title}</div><div class="grid2">`;s.items.forEach(it=>{h+=`<div class="it" onclick="filterSub('${it}')"><img src="https://via.placeholder.com/100?text=${encodeURIComponent(it.charAt(0))}"><p>${it}</p></div>`});h+=`</div>`});document.getElementById('right').innerHTML=h;render(products.filter(p=>c.subs.some(s=>s.items.includes(p.cat)) || i==0));}
function filterSub(name){render(products.filter(p=>p.cat==name || p.name.toLowerCase().includes(name.toLowerCase().split(' ')[0])));document.getElementById('right').innerHTML=`<div class="rtitle">${name}</div><button class="btn b1" style="width:auto;padding:6px 12px" onclick="showCat(${curMain})">← Back to ${categories[curMain].name}</button>`;window.scrollTo(0,0);}
function render(list){let h="";list.forEach(p=>{h+=`<div class="card"><img src="${p.img}"><h4>${p.name}</h4><div style="font-size:9px;color:#666">${p.cat}</div><div class="price">₹${p.price}</div><div class="free">Free Delivery</div><button class="btn b1" onclick="cart.push(products.find(x=>x.id==${p.id}));document.getElementById('cc').innerText=cart.length;alert('Cart!')">Add to Cart</button></div>`});document.getElementById('plist').innerHTML=h;document.getElementById('cc').innerText=cart.length;}
function searchF(){let q=document.getElementById('sr').value.toLowerCase();if(!q){showCat(curMain);return;}document.getElementById('right').innerHTML=`<div class="rtitle">Search: ${q}</div>`;render(products.filter(p=>p.name.toLowerCase().includes(q)));}
function placeO(){if(!cart.length)return alert("Empty");let t=cart.reduce((s,p)=>s+p.price,0);orders.push({id:Date.now(),total:t,items:[...cart]});cart=[];render(products);alert("Order ₹"+t+" Placed!");openP('orders');showO();}
function showO(){let h="";orders.forEach(o=>{h+=`<div class="box">Order #${o.id} - ₹${o.total}<br>${o.items.map(i=>i.name).join(", ")}</div>`});document.getElementById('obox').innerHTML=h||"<div class='box'>No Orders</div>";}
function openP(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById('p-'+p).classList.add('on');if(p=='orders')showO();}
buildLeft();showCat(0);
</script>
</body>
</html>
