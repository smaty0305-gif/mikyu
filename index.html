<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meesho Full A-Z</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}body{background:#fff;padding-bottom:60px}.header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #ccc}.h1{display:flex;align-items:center;padding:10px 12px;gap:10px;justify-content:space-between;flex-wrap:wrap}.logo{font-size:28px;font-weight:900;color:#f43397;font-style:italic}.search-box{flex:1;min-width:200px;display:flex;border:1px solid #999;border-radius:4px;overflow:hidden;height:42px}.search-box input{flex:1;padding:10px;border:0;outline:none;font-size:14px}.search-box button{padding:0 15px;background:#fff;border:0;border-left:1px solid #999}.icons{display:flex;gap:12px;font-size:11px}.icons div{text-align:center;cursor:pointer}.icons b{font-size:18px;display:block}.h2{display:flex;overflow:auto;gap:12px;padding:10px 12px;border-top:1px solid #eee;white-space:nowrap;font-size:12px;font-weight:600}.h2 span{cursor:pointer}.h2 span:hover{color:#f43397;border-bottom:3px solid #f43397}.mega{position:absolute;top:92px;left:0;width:100%;background:#fff;box-shadow:0 10px 20px rgba(0,0,0,.1);display:none;z-index:999;padding:12px;grid-template-columns:repeat(6,1fr);gap:12px;border-top:1px solid #eee}.mega.on{display:grid}.mega h5{color:#9f2089;font-size:12px;margin-bottom:6px}.mega p{font-size:10px;padding:3px 0;cursor:pointer}.mega p:hover{color:#f43397;font-weight:700}.offer{background:#fde2e2;text-align:center;padding:5px;font-size:11px;font-weight:600}.offer b{color:#f43397}.container{display:flex;max-width:1300px;margin:0 auto}.left{width:23%;border-right:1px solid #eee;padding:10px;position:sticky;top:95px;height:100vh;overflow:auto}.left h3{font-size:14px;margin-bottom:8px}.fbox{border:1px solid #eee;border-radius:8px;padding:8px;margin-bottom:8px}.fbox h4{font-size:12px;margin-bottom:5px}.fbox label{font-size:11px;display:block;padding:3px 0}.right{width:77%;padding:10px}.right h2{font-size:16px}.right p{font-size:10px;color:#666;margin:3px 0}.sort{display:flex;justify-content:flex-end;padding:6px 0;border-bottom:1px solid #eee;margin-bottom:8px}.sort select{padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{border:1px solid #e9e9e9;border-radius:8px;overflow:hidden;cursor:pointer}.card img{width:100%;height:180px;object-fit:cover;background:#f8f8f8}.card-body{padding:5px}.card-body h3{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-body h4{font-size:12px;height:30px;overflow:hidden;line-height:15px;margin:2px 0}.price{font-size:14px;font-weight:800}.price s{font-size:10px;color:#999}.off{color:#038d63;font-size:10px;font-weight:700}.del{font-size:9px;background:#f8f8f8;padding:2px 5px;border-radius:10px;display:inline-block;margin-top:3px}.rat{background:#23bb75;color:#fff;font-size:9px;padding:2px 5px;border-radius:12px;font-weight:700}.bottom{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #ddd;z-index:1000}.bottom div{font-size:10px;text-align:center;color:#666}.bottom div.on{color:#f43397;font-weight:700}.page{display:none}.page.on{display:block}@media(max-width:768px){.search-box{order:3;width:100%}.left{display:none}.right{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.card img{height:140px}.mega{top:115px;grid-template-columns:repeat(2,1fr);max-height:70vh;overflow:auto}}</style></head><body>
<div class="header"><div class="h1"><div class="logo">meesho</div><div class="search-box"><input id="s" placeholder="Try Saree, Kurti or Product Code" oninput="searchP()"><button>🔍</button></div><div class="icons"><div><b>📱</b>App</div><div><b>🏢</b>Supplier</div><div onclick="openP('cart')"><b>🛒</b>Cart <span id="cc" style="color:#f43397;font-weight:800">0</span></div><div><b>👤</b>Profile</div></div></div><div class="h2" id="topCats"></div><div id="mega" class="mega"></div></div>
<div class="offer">Lowest Prices | <b>Free Delivery</b> | <b>COD</b> | <b>Easy Returns</b> | <b>0% Commission</b></div>
<div id="p-home" class="page on"><div class="container"><div class="left"><h3>Filters <span style="color:#f43397;font-size:10px;cursor:pointer" onclick="clearF()">CLEAR</span></h3><div id="filters"></div></div><div class="right"><h2 id="catName">Products For You</h2><p id="catCount"></p><div class="sort"><select onchange="sortP(this.value)"><option value="rel">Relevance</option><option value="low">Low to High</option><option value="high">High to Low</option><option value="rat">Ratings</option></select></div><div class="grid" id="grid"></div></div></div></div>
<div id="p-cart" class="page"><div style="max-width:800px;margin:12px auto;padding:10px"><h2>Cart (<span id="cc2">0</span>)</h2><div id="cbox"></div><div style="border:1px solid #eee;padding:10px;margin-top:8px;border-radius:8px"><h3 id="ctotal"></h3><p style="font-size:10px;color:#038d63;margin:5px 0">✓ Free Delivery ✓ COD ✓ 7-Day Return</p><button onclick="placeO()" style="width:100%;padding:12px;background:#f43397;color:#fff;border:0;border-radius:4px;font-weight:700">Continue - COD</button><button onclick="openP('home')" style="width:100%;padding:10px;background:#fff;color:#f43397;border:1px solid #f43397;border-radius:4px;font-weight:700;margin-top:6px">Continue Shopping</button></div></div></div>
<div id="p-orders" class="page"><div style="max-width:800px;margin:12px auto;padding:10px"><h2>My Orders</h2><div id="obox"></div></div></div>
<div class="bottom"><div class="on" onclick="openP('home')">🏠<br>Home</div><div onclick="openP('cart')">🛒<br>Cart</div><div onclick="openP('orders')">📦<br>Orders</div><div>👤<br>Account</div></div>
<script>
const cats=[{name:"Women Ethnic",subs:[{t:"Sarees",i:["Silk Sarees","Cotton Sarees","Georgette Sarees","Chiffon Sarees","Banarasi Sarees"]},{t:"Kurtis",i:["Anarkali Kurtis","Rayon Kurtis","Cotton Kurtis","Kurta Sets","Sharara","Gowns"]}]},{name:"Women Western",subs:[{t:"Topwear",i:["Tops","Dresses","T-Shirts","Jeans","Palazzo"]}]},{name:"Men",subs:[{t:"Wear",i:["T-Shirts","Shirts","Jeans","Track Pants","Casual Shoes","Sports Shoes"]}]},{name:"Kids",subs:[{t:"Wear",i:["Frocks","Dresses"]},{t:"Toys",i:["Soft Toys","Dolls","Cars","Educational"]}]},{name:"Home & Kitchen",subs:[{t:"Kitchen",i:["Storage","Cookware","Containers"]},{t:"Decor",i:["Bedsheets","Curtains","Wall Decor"]}]},{name:"Beauty",subs:[{t:"Makeup",i:["Lipstick","Face Cream","Serums","Face Wash"]}]},{name:"Jewellery",subs:[{t:"Jewellery",i:["Jewellery Set","Earrings","Mangalsutra","Bangles","Rings"]}]},{name:"Bags & Footwear",subs:[{t:"Bags",i:["Handbags","Sling Bags","Backpacks"]},{t:"Footwear",i:["Heels","Flats","Boots"]}]},{name:"Electronics",subs:[{t:"Mobile",i:["Phone Cases","Chargers"]},{t:"Gadgets",i:["Smart Watches","Earbuds","Headphones"]}]},{name:"Grocery",subs:[{t:"Grocery",i:["Dry Fruits","Spices","Pulses"]}]},{name:"Books",subs:[{t:"Stationery",i:["Notebooks","Pens","School Bags","Pet Supplies"]}]},{name:"Sports",subs:[{t:"Sports",i:["Cricket","Football","Gym"]}]},{name:"Pets",subs:[{t:"Pets",i:["Dog Food","Cat Food"]}]},{name:"Car & Bike",subs:[{t:"Acc",i:["Car Covers","Bike Covers"]}]}];
const products=[{id:1,name:"Georgette Embroidered Saree with Blouse",cat:"Silk Sarees",price:449,mrp:1999,rat:4.1,rev:5234,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"},{id:2,name:"Women Rayon Anarkali Kurta Palazzo Set",cat:"Kurta Sets",price:599,mrp:2499,rat:4.2,rev:3421,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400"},{id:3,name:"Cotton Silk Saree Party Wear",cat:"Cotton Sarees",price:399,mrp:1299,rat:4,rev:2341,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"},{id:4,name:"Men Printed Cotton T-Shirt Combo",cat:"T-Shirts",price:299,mrp:999,rat:4.3,rev:5432,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},{id:5,name:"Kids Girls Frocks Dress Ethnic",cat:"Frocks",price:249,mrp:799,rat:4.4,rev:1234,img:"https://images.unsplash.com/photo-1518831959646-742c3a14ebf7?w=400"},{id:6,name:"Kitchen Storage Container Set 6 Pcs",cat:"Containers",price:199,mrp:599,rat:4.1,rev:7654,img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400"},{id:7,name:"Matte Lipstick Long Lasting Pack",cat:"Lipstick",price:149,mrp:399,rat:4,rev:4321,img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400"},{id:8,name:"Gold Plated Jewellery Set Wedding",cat:"Jewellery Set",price:199,mrp:699,rat:4.2,rev:6543,img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400"},{id:9,name:"Women Sling Bag Handbag Combo",cat:"Handbags",price:399,mrp:1299,rat:4.1,rev:3421,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"},{id:10,name:"Wireless Bluetooth Earbuds with Mic",cat:"Earbuds",price:499,mrp:1999,rat:4.3,rev:9876,img:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400"},{id:11,name:"Dry Fruits Combo Box Gift Pack",cat:"Dry Fruits",price:499,mrp:999,rat:4.2,rev:2134,img:"https://images.unsplash.com/photo-1542838132-92c53300491e?w=400"},{id:12,name:"Chiffon Saree Daily Wear Light",cat:"Chiffon Sarees",price:349,mrp:999,rat:4,rev:3214,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"},{id:13,name:"Soft Toys Teddy Bear 3 Feet",cat:"Soft Toys",price:299,mrp:799,rat:4.5,rev:5432,img:"https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=400"},{id:14,name:"Smart Watch Men Women Fitness",cat:"Smart Watches",price:799,mrp:2999,rat:4.2,rev:8765,img:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400"}];
let cart=[],orders=[],curCat="All",curSub="";function buildTop(){let h="";cats.forEach((c,i)=>{h+=`<span onmouseover="showMega(${i})" onclick="filterCat('${c.name}')">${c.name}</span>`});document.getElementById('topCats').innerHTML=h;}function showMega(i){let c=cats[i];let h="";c.subs.forEach(s=>{h+=`<div><h5>${s.t}</h5>`;s.i.forEach(it=>{h+=`<p onclick="filterSub('${it}')">${it}</p>`});h+=`</div>`});document.getElementById('mega').innerHTML=h;document.getElementById('mega').classList.add('on');}document.addEventListener('click',e=>{if(!e.target.closest('#topCats')&&!e.target.closest('#mega'))document.getElementById('mega').classList.remove('on')});function buildF(){let h=`<div class="fbox"><h4>Category</h4>`;cats.slice(0,6).forEach(c=>{h+=`<label><input type="checkbox" onchange="filterCat('${c.name}')"> ${c.name}</label>`});h+=`</div><div class="fbox"><h4>Price</h4><label><input type="radio" name="p" onchange="filterPrice(0,200)"> Under ₹200</label><label><input type="radio" name="p" onchange="filterPrice(200,400)"> ₹200-₹400</label><label><input type="radio" name="p" onchange="filterPrice(400,600)"> ₹400-₹600</label><label><input type="radio" name="p" onchange="filterPrice(600,10000)"> Above ₹600</label></div><div class="fbox"><h4>Rating</h4><label><input type="checkbox" onchange="filterRat(4)"> 4★ & above</label></div><div class="fbox"><h4>Benefits</h4><label><input type="checkbox" checked> ✓ Free Delivery</label><label><input type="checkbox" checked> ✓ COD</label><label><input type="checkbox" checked> ✓ Easy Return</label><label><input type="checkbox" checked> ✓ 0% Commission</label></div>`;document.getElementById('filters').innerHTML=h;}function render(list){let h="";list.forEach(p=>{let off=Math.round((1-p.price/p.mrp)*100);h+=`<div class="card" onclick="showD(${p.id})"><img src="${p.img}"><div class="card-body"><h3>${p.cat}</h3><h4>${p.name}</h4><div class="price">₹${p.price} <s>₹${p.mrp}</s> <span class="off">${off}% off</span></div><div><span class="del">Free Delivery</span></div><div><span class="rat">${p.rat} ★</span> <span style="font-size:9px;color:#666">${p.rev} Reviews</span></div></div></div>`});document.getElementById('grid').innerHTML=h||"<p style='padding:20px'>No Products</p>";document.getElementById('catCount').innerText=`${list.length} Products | Free Delivery | COD | 0% Commission | ${curCat} ${curSub}`;}function filterCat(n){curCat=n;curSub="";document.getElementById('catName').innerText=n;document.getElementById('mega').classList.remove('on');let c=cats.find(x=>x.name==n);if(!c){render(products);return;}let items=c.subs.flatMap(s=>s.i);render(products.filter(p=>items.some(it=>p.cat==it||p.cat.toLowerCase().includes(it.toLowerCase().split(' ')[0])||it.toLowerCase().includes(p.cat.toLowerCase().split(' ')[0]))));window.scrollTo(0,0);}function filterSub(s){curSub=s;document.getElementById('catName').innerText=s;document.getElementById('mega').classList.remove('on');render(products.filter(p=>p.cat==s||p.name.toLowerCase().includes(s.toLowerCase().split(' ')[0])||s.toLowerCase().includes(p.cat.toLowerCase().split(' ')[0])));window.scrollTo(0,0);}function filterPrice(a,b){render(products.filter(p=>p.price>=a&&p.price<=b));}function filterRat(r){render(products.filter(p=>p.rat>=r));}function clearF(){render(products);document.getElementById('catName').innerText="Products For You";document.querySelectorAll('.left input').forEach(i=>i.checked=false);}function searchP(){let q=document.getElementById('s').value.toLowerCase();if(!q)render(products);else render(products.filter(p=>p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)));document.getElementById('catName').innerText=`Search: "${q}"`;}function sortP(v){let l=[...products];if(v=="low")l.sort((a,b)=>a.price-b.price);if(v=="high")l.sort((a,b)=>b.price-a.price);if(v=="rat")l.sort((a,b)=>b.rat-a.rat);render(l);}function addC(id){cart.push(products.find(x=>x.id==id));upd();alert("Added! Free Delivery + COD");}function upd(){document.getElementById('cc').innerText=cart.length;document.getElementById('cc2').innerText=cart.length;let t=0,tx="";cart.forEach((p,i)=>{t+=p.price;tx+=`<div style="border:1px solid #eee;padding:8px;margin:6px 0;border-radius:6px;display:flex;gap:8px"><img src="${p.img}" style="width:60px;height:60px"><div><b style="font-size:12px">${p.name}</b><br><span style="font-size:10px;color:#666">${p.cat}</span><br><b>₹${p.price}</b> <s style="font-size:10px;color:#999">₹${p.mrp}</s><br><span style="color:red;font-size:11px;cursor:pointer" onclick="cart.splice(${i},1);upd();showCart()">Remove</span></div></div>`});document.getElementById('cbox').innerHTML=tx||"<p>Cart Empty</p>";document.getElementById('ctotal').innerText="Total: ₹"+t+" (Free Delivery)";}function showCart(){upd();}function showD(id){let p=products.find(x=>x.id==id);document.getElementById('cbox').innerHTML=`<div style="padding:10px"><img src="${p.img}" style="width:100%;max-width:300px"><h2 style="font-size:15px;margin:6px 0">${p.name}</h2><p style="color:#666;font-size:11px">${p.cat} | ${p.rat} ★ | ${p.rev} Reviews</p><div style="font-size:18px;font-weight:800;margin:6px 0">₹${p.price} <s style="font-size:12px;color:#999">₹${p.mrp}</s> <span style="color:#038d63;font-size:12px">${Math.round((1-p.price/p.mrp)*100)}% off</span></div><div style="margin:6px 0"><span style="background:#e6f8f2;color:#038d63;padding:3px 6px;border-radius:20px;font-size:10px">✓ Free Delivery</span> <span style="background:#f0f0ff;padding:3px 6px;border-radius:20px;font-size:10px">✓ COD</span> <span style="background:#fff0f6;color:#9f2089;padding:3px 6px;border-radius:20px;font-size:10px">✓ 7-Day Return</span></div><button onclick="addC(${p.id})" style="width:100%;padding:10px;background:#fff;color:#f43397;border:1px solid #f43397;border-radius:4px;font-weight:700;margin-top:6px">Add to Cart</button><button onclick="addC(${p.id});openP('cart')" style="width:100%;padding:10px;background:#f43397;color:#fff;border:0;border-radius:4px;font-weight:700;margin-top:6px">Buy Now - COD</button><button onclick="openP('home')" style="width:100%;padding:10px;background:#fff;border:1px solid #ccc;border-radius:4px;margin-top:6px">Continue Shopping</button></div>`;openP('cart');}function placeO(){if(!cart.length)return alert("Cart Empty!");let t=cart.reduce((s,p)=>s+p.price,0);orders.unshift({id:Date.now(),total:t,items:[...cart],date:new Date().toLocaleDateString()});cart=[];upd();alert("Order Placed! ₹"+t+" | Valmo Tomorrow | COD | Free Delivery");openP('orders');showO();}function showO(){let h="";orders.forEach(o=>{h+=`<div style="border:1px solid #eee;padding:8px;margin:6px 0;border-radius:8px"><b>Order #${o.id}</b> - ${o.date}<br>${o.items.map(i=>i.name).join(", ")}<br><b>Total: ₹${o.total}</b> - Free Delivery - COD<br><span style="font-size:9px;color:#038d63">✓ Ordered ✓ Packed ✓ Shipped via Valmo</span></div>`});document.getElementById('obox').innerHTML=h||"<p>No Orders Yet</p>";}function openP(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById('p-'+p).classList.add('on');if(p=='cart')showCart();if(p=='orders')showO();window.scrollTo(0,0);}buildTop();buildF();render(products);upd();
</script></body></html>
